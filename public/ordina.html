<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ordina - IA-CALL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e4e4e7;
      --muted: #71717a; --accent: #6366f1; --accent-light: #818cf8;
      --green: #22c55e; --yellow: #eab308; --red: #ef4444;
    }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
    }

    /* HEADER */
    .header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem; text-align: center;
    }
    .header .logo { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    .header .logo span { color: var(--accent); font-weight: 700; }
    .header h1 { font-size: 1.3rem; font-weight: 700; }
    .header .type { color: var(--muted); font-size: 0.85rem; }

    /* CHAT AREA */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.75rem;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%; padding: 0.9rem 1.1rem; border-radius: 16px;
      font-size: 0.95rem; line-height: 1.5; animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .msg-ai {
      background: var(--card); border: 1px solid var(--border);
      align-self: flex-start; border-bottom-left-radius: 4px;
    }
    .msg-user {
      background: var(--accent); color: white;
      align-self: flex-end; border-bottom-right-radius: 4px;
    }
    .msg-system {
      align-self: center; text-align: center; color: var(--muted);
      font-size: 0.8rem; padding: 0.5rem;
    }
    .typing-indicator {
      align-self: flex-start; padding: 0.8rem 1.2rem;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; border-bottom-left-radius: 4px;
      display: none;
    }
    .typing-indicator.active { display: flex; gap: 4px; align-items: center; }
    .typing-dot {
      width: 8px; height: 8px; background: var(--muted); border-radius: 50%;
      animation: typingBounce 1.4s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* ORDER COMPLETE */
    .order-done {
      align-self: center; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3);
      border-radius: 16px; padding: 1.5rem; text-align: center; max-width: 320px;
    }
    .order-done .check { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .order-done h3 { color: var(--green); margin-bottom: 0.5rem; }
    .order-done p { color: var(--muted); font-size: 0.85rem; }
    .order-done .btn-restart {
      margin-top: 1rem; padding: 0.6rem 1.5rem; background: var(--accent);
      color: white; border: none; border-radius: 8px; font-size: 0.9rem;
      font-weight: 600; cursor: pointer;
    }

    /* CONTROLS */
    .controls {
      background: var(--card); border-top: 1px solid var(--border);
      padding: 1rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    }
    .mic-row { display: flex; align-items: center; gap: 1rem; width: 100%; }
    .text-input {
      flex: 1; padding: 0.7rem 1rem; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 0.95rem; outline: none;
    }
    .text-input:focus { border-color: var(--accent); }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--accent);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .send-btn svg { width: 20px; height: 20px; fill: white; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .mic-btn {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; position: relative;
    }
    .mic-btn svg { width: 28px; height: 28px; fill: white; }
    .mic-btn:hover { background: var(--accent-light); transform: scale(1.05); }
    .mic-btn.listening {
      background: var(--red); animation: micPulse 1.5s infinite;
    }
    @keyframes micPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
    }
    .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }

    .status-text { font-size: 0.8rem; color: var(--muted); text-align: center; }

    /* START SCREEN */
    .start-screen {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2rem; text-align: center;
    }
    .start-screen .icon { font-size: 4rem; margin-bottom: 1.5rem; opacity: 0.8; }
    .start-screen h2 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    .start-screen p { color: var(--muted); font-size: 0.95rem; max-width: 340px; margin-bottom: 2rem; }
    .start-btn {
      padding: 1rem 2.5rem; background: var(--accent); color: white;
      border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .start-btn:hover { background: var(--accent-light); transform: translateY(-2px); }
    .start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ERROR */
    .error-screen {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2rem; text-align: center;
    }
    .error-screen .icon { font-size: 3rem; margin-bottom: 1rem; }
    .error-screen h2 { color: var(--red); margin-bottom: 0.5rem; }
    .error-screen p { color: var(--muted); font-size: 0.9rem; }

    /* BROWSER SUPPORT WARNING */
    .browser-warn {
      background: rgba(234,179,8,0.12); border: 1px solid rgba(234,179,8,0.3);
      border-radius: 8px; padding: 0.75rem; font-size: 0.8rem; color: var(--yellow);
      text-align: center; margin-bottom: 0.5rem;
    }

    @media (max-width: 500px) {
      .header { padding: 0.75rem 1rem; }
      .chat-area { padding: 0.75rem; }
      .controls { padding: 0.75rem 1rem; }
      .msg { max-width: 90%; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo"><span>IA</span>-CALL</div>
    <h1 id="business-name">Caricamento...</h1>
    <div class="type" id="business-type"></div>
  </div>

  <!-- START SCREEN -->
  <div class="start-screen" id="start-screen">
    <div class="icon">&#127828;</div>
    <h2 id="start-title">Ordina con la voce</h2>
    <p>Parla con il nostro assistente AI per effettuare il tuo ordine. Veloce, semplice, naturale.</p>
    <button class="start-btn" id="start-btn" onclick="startConversation()">Inizia a ordinare</button>
  </div>

  <!-- ERROR SCREEN -->
  <div class="error-screen" id="error-screen" style="display:none">
    <div class="icon">&#9888;&#65039;</div>
    <h2>Attivita non trovata</h2>
    <p>Il link che hai seguito non corrisponde a nessuna attivita attiva.</p>
  </div>

  <!-- CHAT SCREEN -->
  <div class="chat-area" id="chat-area" style="display:none"></div>
  <div class="typing-indicator" id="typing">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>

  <div class="controls" id="controls" style="display:none">
    <div id="browser-warn-container"></div>
    <div class="mic-row">
      <input type="text" class="text-input" id="text-input" placeholder="Scrivi il tuo messaggio..."
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendTextMessage()}">
      <button class="send-btn" id="send-btn" onclick="sendTextMessage()" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
    </div>
    <div class="status-text" id="status-text">Premi il microfono o scrivi un messaggio</div>
  </div>

  <!-- AUDIO PLAYER (hidden) -->
  <audio id="audio-player" preload="none"></audio>

  <script>
    const API = window.location.origin;
    const slug = window.location.pathname.split('/ordina/')[1];

    let sessionId = null;
    let isListening = false;
    let isProcessing = false;
    let recognition = null;
    let hasSpeechAPI = false;

    // ===== INIT =====
    async function init() {
      if (!slug) { showError(); return; }

      try {
        const res = await fetch(`${API}/api/tenant/${slug}/info`);
        if (!res.ok) { showError(); return; }
        const info = await res.json();

        document.getElementById('business-name').textContent = info.name;
        document.getElementById('start-title').textContent = `Ordina da ${info.name}`;
        document.title = `Ordina da ${info.name} - IA-CALL`;

        const typeMap = { ristorante:'Ristorante', bar:'Bar', negozio:'Negozio', farmacia:'Farmacia', altro:'Attivita' };
        document.getElementById('business-type').textContent = typeMap[info.business_type] || info.business_type;

      } catch {
        showError();
      }

      // Check Web Speech API support
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        hasSpeechAPI = true;
        recognition = new SpeechRecognition();
        recognition.lang = 'it-IT';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
          const text = event.results[0][0].transcript;
          stopListening();
          addMessage('user', text);
          sendMessage(text);
        };

        recognition.onerror = (event) => {
          console.log('Speech error:', event.error);
          stopListening();
          if (event.error === 'no-speech') {
            setStatus('Nessun audio rilevato. Riprova.');
          } else if (event.error === 'not-allowed') {
            setStatus('Microfono non autorizzato. Usa la chat testuale.');
            document.getElementById('browser-warn-container').innerHTML =
              '<div class="browser-warn">Microfono non autorizzato. Puoi comunque ordinare scrivendo.</div>';
          }
        };

        recognition.onend = () => {
          if (isListening) stopListening();
        };
      } else {
        document.getElementById('browser-warn-container').innerHTML =
          '<div class="browser-warn">Il tuo browser non supporta il riconoscimento vocale. Puoi ordinare scrivendo.</div>';
      }
    }

    function showError() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
    }

    // ===== START CONVERSATION =====
    async function startConversation() {
      const btn = document.getElementById('start-btn');
      btn.textContent = 'Connessione...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/api/voice/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug })
        });

        if (!res.ok) throw new Error('Failed to start');
        const data = await res.json();

        sessionId = data.sessionId;

        // Show chat UI
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('chat-area').style.display = 'flex';
        document.getElementById('controls').style.display = 'flex';

        // Enable controls
        document.getElementById('mic-btn').disabled = !hasSpeechAPI;
        document.getElementById('send-btn').disabled = false;

        // Show greeting
        addMessage('ai', data.text);

        // Play greeting audio
        if (data.audioUrl) {
          playAudio(data.audioUrl);
        }

        setStatus('Premi il microfono o scrivi un messaggio');

      } catch (err) {
        console.error('Start error:', err);
        btn.textContent = 'Riprova';
        btn.disabled = false;
        addSystemMessage('Errore di connessione. Riprova.');
      }
    }

    // ===== MESSAGES =====
    function addMessage(role, text) {
      const chat = document.getElementById('chat-area');
      const div = document.createElement('div');
      div.className = `msg msg-${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addSystemMessage(text) {
      const chat = document.getElementById('chat-area');
      const div = document.createElement('div');
      div.className = 'msg msg-system';
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showOrderComplete() {
      const chat = document.getElementById('chat-area');
      const div = document.createElement('div');
      div.className = 'order-done';
      div.innerHTML = `
        <div class="check">&#9989;</div>
        <h3>Ordine confermato!</h3>
        <p>Il tuo ordine e stato inviato al ristorante. Grazie!</p>
        <button class="btn-restart" onclick="restartOrder()">Nuovo ordine</button>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      // Disable controls
      document.getElementById('mic-btn').disabled = true;
      document.getElementById('send-btn').disabled = true;
      document.getElementById('text-input').disabled = true;
      setStatus('Ordine completato');
    }

    function restartOrder() {
      sessionId = null;
      document.getElementById('chat-area').innerHTML = '';
      document.getElementById('chat-area').style.display = 'none';
      document.getElementById('controls').style.display = 'none';
      document.getElementById('start-screen').style.display = 'flex';
      const btn = document.getElementById('start-btn');
      btn.textContent = 'Inizia a ordinare';
      btn.disabled = false;
      document.getElementById('text-input').disabled = false;
    }

    // ===== SEND MESSAGE =====
    async function sendMessage(text) {
      if (!sessionId || isProcessing || !text.trim()) return;
      isProcessing = true;
      showTyping(true);
      setStatus('L\'assistente sta rispondendo...');
      disableControls(true);

      try {
        const res = await fetch(`${API}/api/voice/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, text: text.trim(), slug })
        });

        const data = await res.json();
        showTyping(false);

        if (data.text) {
          addMessage('ai', data.text);
        }

        if (data.audioUrl) {
          playAudio(data.audioUrl);
        }

        if (data.orderComplete) {
          if (data.orderData) {
            showOrderComplete();
          } else {
            addSystemMessage('Ordine annullato.');
            setTimeout(restartOrder, 2000);
          }
          return;
        }

        setStatus('Premi il microfono o scrivi un messaggio');

      } catch (err) {
        console.error('Message error:', err);
        showTyping(false);
        addSystemMessage('Errore di connessione. Riprova.');
        setStatus('Errore - riprova');
      } finally {
        isProcessing = false;
        disableControls(false);
      }
    }

    function sendTextMessage() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text || isProcessing) return;
      input.value = '';
      addMessage('user', text);
      sendMessage(text);
    }

    // ===== MICROPHONE =====
    function toggleMic() {
      if (!hasSpeechAPI || isProcessing) return;
      if (isListening) {
        recognition.stop();
        stopListening();
      } else {
        startListening();
      }
    }

    function startListening() {
      if (!hasSpeechAPI) return;
      isListening = true;
      const btn = document.getElementById('mic-btn');
      btn.classList.add('listening');
      setStatus('Sto ascoltando... parla ora');
      disableControls(true, true);

      try {
        recognition.start();
      } catch (e) {
        // Already started
        stopListening();
      }
    }

    function stopListening() {
      isListening = false;
      const btn = document.getElementById('mic-btn');
      btn.classList.remove('listening');
    }

    // ===== AUDIO =====
    function playAudio(url) {
      const player = document.getElementById('audio-player');
      player.src = url;
      player.play().catch(e => console.log('Audio play blocked:', e.message));
    }

    // ===== UI HELPERS =====
    function setStatus(text) {
      document.getElementById('status-text').textContent = text;
    }

    function showTyping(show) {
      const el = document.getElementById('typing');
      if (show) {
        el.classList.add('active');
        const chat = document.getElementById('chat-area');
        chat.scrollTop = chat.scrollHeight;
      } else {
        el.classList.remove('active');
      }
    }

    function disableControls(disabled, keepMic) {
      document.getElementById('send-btn').disabled = disabled;
      document.getElementById('text-input').disabled = disabled;
      if (!keepMic) {
        document.getElementById('mic-btn').disabled = disabled || !hasSpeechAPI;
      }
    }

    // Enable send button when text input has content
    document.getElementById('text-input').addEventListener('input', function() {
      document.getElementById('send-btn').disabled = !this.value.trim() || isProcessing;
    });

    // Init
    init();
  </script>
</body>
</html>
