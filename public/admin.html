<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - IA-CALL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e4e4e7;
      --muted: #71717a; --accent: #6366f1; --green: #22c55e; --yellow: #eab308; --red: #ef4444;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.3rem; font-weight: 700; }
    .header h1 span { color: var(--accent); }
    .admin-badge { background: rgba(239,68,68,0.15); color: var(--red); padding: 0.3rem 0.8rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; margin-left: 0.75rem; }
    .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #818cf8; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-small { padding: 0.35rem 0.6rem; font-size: 0.75rem; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; padding: 1.5rem 2rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .stat-card .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: 0.25rem; }

    /* TENANTS TABLE */
    .table-container { padding: 0 2rem 2rem; overflow-x: auto; }
    .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .table-header h2 { font-size: 1.2rem; }

    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { background: rgba(99,102,241,0.08); color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    tr:hover { background: rgba(99,102,241,0.03); }

    .status-badge { padding: 0.25rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .status-active { background: rgba(34,197,94,0.15); color: var(--green); }
    .status-suspended { background: rgba(239,68,68,0.15); color: var(--red); }
    .plan-badge { padding: 0.25rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .plan-free { background: rgba(113,113,122,0.15); color: var(--muted); }
    .plan-starter { background: rgba(99,102,241,0.15); color: var(--accent); }
    .plan-pro { background: rgba(234,179,8,0.15); color: var(--yellow); }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 200; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; width: 100%; max-width: 500px; margin: 1rem; }
    .modal h3 { font-size: 1.2rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--muted); }
    .form-group input, .form-group select { width: 100%; padding: 0.6rem 0.8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
    .msg { padding: 0.8rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .msg.success { display: block; background: rgba(34,197,94,0.15); color: var(--green); }
    .msg.error { display: block; background: rgba(239,68,68,0.15); color: var(--red); }

    @media (max-width: 768px) {
      .header { padding: 1rem; }
      .stats-grid { padding: 1rem; }
      .table-container { padding: 0 1rem 1rem; }
      th, td { padding: 0.6rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center">
      <h1><span>IA</span>-CALL</h1>
      <span class="admin-badge">ADMIN</span>
    </div>
    <button class="btn btn-outline" onclick="logout()">Esci</button>
  </div>

  <div class="stats-grid" id="admin-stats">
    <div class="stat-card"><div class="label">Tenant totali</div><div class="value" id="s-tenants">0</div></div>
    <div class="stat-card"><div class="label">Attivi</div><div class="value" id="s-active" style="color:var(--green)">0</div></div>
    <div class="stat-card"><div class="label">Ordini oggi</div><div class="value" id="s-orders" style="color:var(--accent)">0</div></div>
    <div class="stat-card"><div class="label">Chiamate mese</div><div class="value" id="s-calls" style="color:var(--yellow)">0</div></div>
    <div class="stat-card"><div class="label">Free</div><div class="value" id="s-free">0</div></div>
    <div class="stat-card"><div class="label">Starter</div><div class="value" id="s-starter" style="color:var(--accent)">0</div></div>
    <div class="stat-card"><div class="label">Pro</div><div class="value" id="s-pro" style="color:var(--yellow)">0</div></div>
  </div>

  <div class="table-container">
    <div class="table-header">
      <h2>Tenant registrati</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Attivita</th>
          <th>Owner</th>
          <th>Piano</th>
          <th>Telefono</th>
          <th>Stato</th>
          <th>Data</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody id="tenants-body"></tbody>
    </table>
  </div>

  <!-- PHONE MODAL -->
  <div class="modal-overlay" id="phone-modal">
    <div class="modal">
      <h3>Assegna numero di telefono</h3>
      <div class="msg" id="phone-msg"></div>
      <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1rem">Tenant: <strong id="phone-tenant-name"></strong></p>
      <div class="form-group">
        <label>Numero di telefono (es. +3902xxxxxxxx)</label>
        <input type="text" id="phone-input" placeholder="+39...">
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closePhoneModal()">Annulla</button>
        <button class="btn btn-primary" onclick="assignPhone()" id="phone-btn">Assegna</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    const TOKEN = localStorage.getItem('ia_token');
    const USER = JSON.parse(localStorage.getItem('ia_user') || '{}');

    if (!TOKEN) { window.location.href = '/'; }
    if (USER.role !== 'admin') { window.location.href = '/dashboard.html'; }

    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` };
    let currentTenantId = null;

    async function loadStats() {
      try {
        const res = await fetch(`${API}/api/admin/stats`, { headers });
        if (res.status === 403) { window.location.href = '/dashboard.html'; return; }
        const s = await res.json();
        document.getElementById('s-tenants').textContent = s.total_tenants;
        document.getElementById('s-active').textContent = s.active_tenants;
        document.getElementById('s-orders').textContent = s.orders_today;
        document.getElementById('s-calls').textContent = s.monthly_calls;
        document.getElementById('s-free').textContent = s.plans.free;
        document.getElementById('s-starter').textContent = s.plans.starter;
        document.getElementById('s-pro').textContent = s.plans.pro;
      } catch {}
    }

    async function loadTenants() {
      const res = await fetch(`${API}/api/admin/tenants`, { headers });
      const tenants = await res.json();
      const body = document.getElementById('tenants-body');
      body.innerHTML = tenants.map(t => {
        const owner = t.users && t.users.length ? t.users.find(u => u.role === 'owner') || t.users[0] : null;
        return `
          <tr>
            <td><strong>${t.name}</strong><br><span style="color:var(--muted);font-size:0.75rem">${t.business_type}</span></td>
            <td>${owner ? `${owner.name}<br><span style="color:var(--muted);font-size:0.75rem">${owner.email}</span>` : '-'}</td>
            <td><span class="plan-badge plan-${t.plan}">${t.plan.toUpperCase()}</span></td>
            <td>${t.phone_number || '<span style="color:var(--yellow)">Non assegnato</span>'}</td>
            <td><span class="status-badge status-${t.status}">${t.status}</span></td>
            <td style="font-size:0.8rem;color:var(--muted)">${new Date(t.created_at).toLocaleDateString('it-IT')}</td>
            <td>
              ${!t.phone_number ? `<button class="btn btn-primary btn-small" onclick="openPhoneModal('${t.id}','${t.name}')">Assegna Tel</button>` : ''}
              <select class="btn btn-small" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.3rem;font-size:0.75rem" onchange="changePlan('${t.id}',this.value)">
                <option value="free" ${t.plan==='free'?'selected':''}>Free</option>
                <option value="starter" ${t.plan==='starter'?'selected':''}>Starter</option>
                <option value="pro" ${t.plan==='pro'?'selected':''}>Pro</option>
              </select>
              ${t.status==='active'?`<button class="btn btn-small" style="background:var(--red);color:white" onclick="toggleStatus('${t.id}','suspended')">Sospendi</button>`:`<button class="btn btn-small" style="background:var(--green);color:white" onclick="toggleStatus('${t.id}','active')">Riattiva</button>`}
            </td>
          </tr>`;
      }).join('');
    }

    async function changePlan(id, plan) {
      await fetch(`${API}/api/admin/tenants/${id}`, { method: 'PATCH', headers, body: JSON.stringify({ plan }) });
      loadStats();
    }

    async function toggleStatus(id, status) {
      await fetch(`${API}/api/admin/tenants/${id}`, { method: 'PATCH', headers, body: JSON.stringify({ status }) });
      loadTenants(); loadStats();
    }

    function openPhoneModal(tenantId, tenantName) {
      currentTenantId = tenantId;
      document.getElementById('phone-tenant-name').textContent = tenantName;
      document.getElementById('phone-input').value = '';
      document.getElementById('phone-msg').className = 'msg';
      document.getElementById('phone-msg').textContent = '';
      document.getElementById('phone-modal').classList.add('active');
    }

    function closePhoneModal() {
      document.getElementById('phone-modal').classList.remove('active');
      currentTenantId = null;
    }

    async function assignPhone() {
      const phone = document.getElementById('phone-input').value.trim();
      const msgEl = document.getElementById('phone-msg');
      const btn = document.getElementById('phone-btn');

      if (!phone) { msgEl.className = 'msg error'; msgEl.textContent = 'Inserisci un numero'; return; }

      btn.textContent = 'Assegnazione...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/api/admin/tenants/${currentTenantId}/set-phone`, {
          method: 'POST', headers, body: JSON.stringify({ phoneNumber: phone })
        });
        const data = await res.json();

        if (!res.ok) {
          msgEl.className = 'msg error';
          msgEl.textContent = data.error || 'Errore';
          return;
        }

        msgEl.className = 'msg success';
        msgEl.textContent = `Numero ${phone} assegnato con successo!`;
        setTimeout(() => { closePhoneModal(); loadTenants(); }, 1500);
      } catch (err) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Errore di connessione';
      } finally {
        btn.textContent = 'Assegna';
        btn.disabled = false;
      }
    }

    function logout() {
      localStorage.removeItem('ia_token');
      localStorage.removeItem('ia_user');
      localStorage.removeItem('ia_tenant');
      window.location.href = '/';
    }

    loadStats();
    loadTenants();
    setInterval(() => { loadStats(); loadTenants(); }, 15000);
  </script>
</body>
</html>
